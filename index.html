<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E15">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="Claves CBPM">
<meta name="description" content="Claves radiales del Cuerpo de Bomberos de Puerto Montt. Búsqueda rápida por clave o descripción.">
<title>Claves Radiales · CB Puerto Montt</title>
<script>
  // Aplica el tema guardado antes de pintar para evitar parpadeo
  (function(){
    try {
      var t = localStorage.getItem("cbpm-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  /* Concepto: consola de despacho. Panel oscuro o claro, claves en monoespaciada
     tipo pantalla de radio, color por categoría y una sola animación ambiental
     (barras de señal en la cabecera). */
  :root {
    --bg: #EDF0F5;
    --bg-2: #E2E7EF;
    --surface: #FFFFFF;
    --surface-2: #F4F6FA;
    --hover: rgba(14,20,32,0.045);
    --line: rgba(14,20,32,0.10);
    --line-2: rgba(14,20,32,0.18);
    --fg: #0E1420;
    --fg-2: rgba(14,20,32,0.72);
    --fg-3: rgba(14,20,32,0.58);
    --accent: #C8202E;
    --accent-ink: #FFFFFF;
    --glow: rgba(200,32,46,0.16);
    --grid: rgba(14,20,32,0.05);
    --shadow: 0 1px 2px rgba(14,20,32,0.06), 0 10px 28px -12px rgba(14,20,32,0.22);
    --bar: rgba(237,240,245,0.86);
    --ico-sun: none;
    --ico-moon: block;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0E15;
      --bg-2: #10141D;
      --surface: #141925;
      --surface-2: #1A2030;
      --hover: rgba(255,255,255,0.05);
      --line: rgba(255,255,255,0.09);
      --line-2: rgba(255,255,255,0.18);
      --fg: #F2F4F8;
      --fg-2: rgba(242,244,248,0.76);
      --fg-3: rgba(242,244,248,0.58);
      --accent: #FF4D5A;
      --accent-ink: #1A0508;
      --glow: rgba(255,77,90,0.20);
      --grid: rgba(255,255,255,0.045);
      --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 14px 32px -14px rgba(0,0,0,0.7);
      --bar: rgba(11,14,21,0.86);
      --ico-sun: block;
      --ico-moon: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0E15;
    --bg-2: #10141D;
    --surface: #141925;
    --surface-2: #1A2030;
    --hover: rgba(255,255,255,0.05);
    --line: rgba(255,255,255,0.09);
    --line-2: rgba(255,255,255,0.18);
    --fg: #F2F4F8;
    --fg-2: rgba(242,244,248,0.76);
    --fg-3: rgba(242,244,248,0.58);
    --accent: #FF4D5A;
    --accent-ink: #1A0508;
    --glow: rgba(255,77,90,0.20);
    --grid: rgba(255,255,255,0.045);
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 14px 32px -14px rgba(0,0,0,0.7);
    --bar: rgba(11,14,21,0.86);
    --ico-sun: block;
    --ico-moon: none;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    min-height: 100%;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Color por categoría: --c es el color base, --cf es la versión legible en cada tema */
  .k { --cf: var(--c); }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root .k { --cf: color-mix(in srgb, var(--c) 58%, #000); }
  }
  @media (prefers-color-scheme: dark) {
    @supports (color: color-mix(in srgb, red 50%, blue)) {
      :root:not([data-theme="light"]) .k { --cf: color-mix(in srgb, var(--c) 62%, #fff); }
    }
  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root[data-theme="dark"] .k { --cf: color-mix(in srgb, var(--c) 62%, #fff); }
  }

  .wrap {
    width: 100%; max-width: 1120px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ===== CABECERA ===== */
  .hero {
    position: relative; overflow: hidden;
    background:
      radial-gradient(900px 340px at 12% -10%, var(--glow), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .hero .wrap { padding-top: 22px; padding-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px -8px var(--accent);
  }
  .brand-t { min-width: 0; flex: 1; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-3);
  }
  .brand h1 {
    font-size: clamp(26px, 5.4vw, 40px); font-weight: 800; letter-spacing: -0.02em;
    line-height: 1.05; margin-top: 3px; text-wrap: balance;
  }
  .brand h1 span { color: var(--accent); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    border: 1px solid var(--line-2); background: var(--surface); color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn .sun { display: var(--ico-sun); }
  .icon-btn .moon { display: var(--ico-moon); }

  .readout {
    margin-top: 20px; display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap;
  }
  .signal {
    display: flex; align-items: flex-end; gap: 3px; height: 22px; padding: 0 4px 0 0;
    align-self: center; margin-right: 6px;
  }
  .signal i {
    display: block; width: 4px; border-radius: 2px; background: var(--accent);
    height: 30%; animation: sig 1.4s ease-in-out infinite;
  }
  .signal i:nth-child(2) { animation-delay: -0.9s; }
  .signal i:nth-child(3) { animation-delay: -0.4s; }
  .signal i:nth-child(4) { animation-delay: -1.2s; }
  .signal i:nth-child(5) { animation-delay: -0.6s; }
  @keyframes sig { 0%,100% { height: 25%; } 50% { height: 100%; } }
  .stat {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 12px;
    border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line);
  }
  .stat b { font-family: var(--mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat span { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  .hero.compact .readout { display: none; }
  .hero.compact .wrap { padding-top: 14px; padding-bottom: 14px; }
  .hero.compact .mark { width: 40px; height: 40px; border-radius: 12px; }
  .hero.compact .brand h1 { font-size: clamp(20px, 4.4vw, 26px); }

  /* ===== BARRA FIJA: BÚSQUEDA + CHIPS ===== */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bar);
    -webkit-backdrop-filter: saturate(160%) blur(16px); backdrop-filter: saturate(160%) blur(16px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .bar .wrap { padding-top: 12px; padding-bottom: 4px; }
  .srch { position: relative; }
  .srch-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); pointer-events: none; display: flex; }
  .srch input {
    width: 100%; height: 50px; padding: 0 84px 0 44px; border-radius: 14px;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--fg);
    font-size: 16px; font-family: inherit; outline: none; box-shadow: var(--shadow);
    -webkit-appearance: none; appearance: none;
  }
  .srch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .srch input::placeholder { color: var(--fg-3); }
  .srch input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .kbd {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--fg-3);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; background: var(--surface-2);
    pointer-events: none;
  }
  .srch.has .kbd { display: none; }
  .srch-x {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px;
    color: var(--fg-2); height: 34px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }
  .srch-x.vis { display: flex; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 0 12px; scrollbar-width: none; scroll-snap-type: x proximity;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips[hidden] { display: none; }
  .chp {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; scroll-snap-align: center;
    padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--fg-2);
    font-size: 13px; font-weight: 600;
  }
  .chp:hover { border-color: var(--cf); }
  .chp.on { color: var(--cf); border-color: var(--cf); background: color-mix(in srgb, var(--c) 16%, var(--surface)); font-weight: 700; }
  @supports not (color: color-mix(in srgb, red 50%, blue)) { .chp.on { background: var(--surface-2); } }

  /* ===== CONTENIDO ===== */
  .cnt { padding-top: 22px; padding-bottom: 120px; }
  .ibanner {
    display: none; align-items: center; gap: 10px; padding: 12px 14px; margin-top: 18px; border-radius: var(--r-md);
    background: var(--surface); border: 1px solid var(--line-2); font-size: 13px; line-height: 1.45; color: var(--fg-2);
    box-shadow: var(--shadow);
  }
  .ibanner.vis { display: flex; }
  .ibanner .itxt { flex: 1; }
  .ibanner strong { color: var(--fg); }
  .ibanner .ix { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--fg-2); font-size: 14px; cursor: pointer; width: 32px; height: 32px; }

  .qbtn {
    width: 100%; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left;
    margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .qbtn small { font-weight: 500; color: var(--fg-3); margin-left: 8px; font-size: 12px; }
  .qa { font-size: 11px; color: var(--fg-3); transition: transform 0.2s; }
  .qbtn.op .qa { transform: rotate(180deg); }

  .secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; align-items: start; }
  .sec {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  }
  .sec-h {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px;
    background: none; border: none; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left;
  }
  .sec-h:hover { background: var(--hover); }
  .si {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--c) 20%, transparent);
  }
  @supports not (color: color-mix(in srgb, red 50%, blue)) { .si { background: var(--surface-2); } }
  .sec-h h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: var(--cf); flex: 1; min-width: 0; }
  .ct { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); }
  .ar { color: var(--fg-3); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .more {
    width: 100%; padding: 12px; border: none; background: none; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--cf);
  }
  .more:hover { background: var(--hover); }

  /* Filas de claves */
  .crd {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    padding: 11px 16px; background: none; border: none; border-bottom: 1px solid var(--line);
    position: relative; break-inside: avoid;
  }
  .crd:last-child { border-bottom: none; }
  .crd:hover { background: var(--hover); }
  .crd:active { background: var(--surface-2); }
  .bdg {
    font-family: var(--mono); font-size: 14px; font-weight: 800; letter-spacing: -0.01em;
    min-width: 58px; text-align: center; padding: 4px 8px; border-radius: 7px; flex-shrink: 0;
    color: var(--cf); white-space: nowrap; font-variant-numeric: tabular-nums;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  @supports not (color: color-mix(in srgb, red 50%, blue)) { .bdg { border-color: var(--line-2); background: var(--surface-2); } }
  .dsc { font-size: 14px; line-height: 1.45; color: var(--fg); flex: 1; min-width: 0; padding-top: 3px; overflow-wrap: anywhere; }
  .crd.s { padding-left: 38px; }
  .crd.s::before {
    content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 1px; background: var(--line-2);
  }
  .crd.s::after {
    content: ""; position: absolute; left: 24px; top: 22px; width: 8px; height: 1px; background: var(--line-2);
  }
  .crd.s .bdg { font-size: 13px; font-weight: 700; min-width: 52px; background: transparent; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  @supports not (color: color-mix(in srgb, red 50%, blue)) { mark { background: var(--glow); } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
  .list { max-width: 820px; }
  .cols { column-width: 260px; column-gap: 0; margin-bottom: 22px; }

  .ach { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ach .si { width: 46px; height: 46px; font-size: 24px; border-radius: 13px; }
  .ach h2 { font-size: clamp(24px, 5vw, 32px); font-weight: 800; letter-spacing: -0.02em; color: var(--cf); line-height: 1.1; }
  .ach .ab { font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); color: var(--fg-2); }
  .rl { font-size: 13px; color: var(--fg-3); margin-bottom: 14px; font-weight: 600; }
  .rg { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--cf); margin: 22px 0 8px; }
  .rg:first-of-type { margin-top: 0; }
  .emp { text-align: center; padding: 56px 20px; color: var(--fg-3); }
  .emp .big { font-size: 44px; margin-bottom: 10px; }
  .emp p { font-size: 15px; font-weight: 600; color: var(--fg-2); }
  .emp p + p { font-size: 13px; font-weight: 500; margin-top: 4px; color: var(--fg-3); }

  .foot { margin-top: 30px; font-size: 12px; color: var(--fg-3); text-align: center; letter-spacing: 0.02em; }

  .bbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; display: flex; justify-content: center;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, var(--bg) 40%, transparent); pointer-events: none;
  }
  .bbar[hidden] { display: none; }
  .bbtn {
    pointer-events: auto; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow);
  }
  .bbtn:hover { border-color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast b { font-family: var(--mono); }

  @media (min-width: 720px) {
    .hero .wrap { padding-top: 34px; padding-bottom: 32px; }
    .mark { width: 62px; height: 62px; border-radius: 18px; }
    .cnt { padding-top: 28px; }
    .crd { padding: 12px 18px; }
    .bbar { display: none; }
  }
  @media (max-width: 520px) {
    .signal { display: none; }
    .readout { gap: 8px; }
    .stat { flex: 1; justify-content: center; padding: 8px 6px; gap: 6px; }
    .stat b { font-size: 18px; }
    .stat span { font-size: 9.5px; letter-spacing: 0.05em; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .signal i { animation: none; height: 60%; }
    .qa, .toast { transition: none; }
  }
  @media print {
    :root { --bg: #fff; --surface: #fff; --fg: #000; --fg-2: #222; --fg-3: #444; --line: #bbb; --line-2: #999; --shadow: none; }
    .hero, .bar, .bbar, .toast, .ibanner, .icon-btn, .qbtn, .more, .ar { display: none !important; }
    .sec, .panel { box-shadow: none; }
    .cols { column-count: 2; }
    .list { max-width: none; }
  }
</style>
</head>
<body>

<header class="hero" id="hero">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      </div>
      <div class="brand-t">
        <div class="eyebrow">CB Puerto Montt · POE-C01</div>
        <h1>Claves <span>Radiales</span></h1>
      </div>
      <button class="icon-btn" id="th" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="readout" id="ro" aria-label="Resumen del cuadro de claves"></div>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="srch" id="sw">
      <span class="srch-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="si" type="search" placeholder="Buscar clave o descripción..." aria-label="Buscar clave o descripción" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <span class="kbd" aria-hidden="true">/</span>
      <button class="srch-x" id="sx" type="button" aria-label="Borrar búsqueda">Borrar</button>

</div>

<main class="wrap cnt">
  <div class="ibanner" id="ib">
    <div class="itxt" id="it"></div>
    <button class="ix" id="ic" type="button" aria-label="Cerrar aviso">✕</button>
  </div>
  <div id="ct" style="margin-top:18px"></div>
  <p class="foot" id="ft">Toca una clave para copiarla</p>
</main>

<div class="bbar" id="bb" hidden><button class="bbtn" id="bk" type="button">← Todas las categorías</button></div>
<div class="toast" id="ts" role="status" aria-live="polite"></div>

<script>
(function(){
  // ===== DATA =====
  var cats = [
    {id:"general",lb:"General",ic:"📻",cl:"#E63946",ds:[
      ["0-0","Silenciar transmisiones radiales hasta nueva orden"],["0-1","Dé y/o amplíe el Preinforme"],["0-2","Se consulta y se informa..."],["0-3","Repita en forma lenta y pausada"],["0-4","Indica de qué se trata..."],["0-5","Indique su ubicación"],["0-6","Diríjase al lugar con alarmas"],["0-7","Llegue al lugar sin alarmas"],["0-8","Fuera de servicio"],["0-9","En servicio"],["0-10","Regrese a su Cuartel"],["0-11","Guardia preventiva"],["0-12","Transmita por el equipo radial del Material Mayor"]]},
    {id:"solicitudes",lb:"Solicitudes",ic:"🚨",cl:"#457B9D",ds:[
      ["1-0","Se solicita Carabineros"],["1-1","Se solicita Apoyo aéreo"],["1-2","Se solicita Ambulancia"],["1-3","Se solicita Personal de la Municipalidad"],["1-4","Se solicita Empresa que se indica..."],["1-5","Se solicita CONAF"],["1-6","Se solicita Comandante de Guardia"],["1-7","Se solicita Capitán de Guardia"],["1-8","Se solicita Depto. Investigación de Incendios"],["1-9","Se solicita Equipo USAR"],["1-10","Se solicita Apoyo bomberil que se indica..."],["1-11","Persona que se comunicó con Central acérquese a la máquina"],["1-12","Indique tiempo estimado de llegada de..."]]},
    {id:"despacho",lb:"Despacho",ic:"🚒",cl:"#2A9D8F",ds:[
      ["2-0","Despache al lugar un Carro Bomba"],["2-1","Despache al lugar un Carro Portaescalas"],["2-2","Despache al lugar un Carro de Rescate"],["2-3","Despache al lugar Ambulancia de bomberos"],["2-4","Despache al lugar un Carro Cisterna"],["2-5","Despache al lugar un Carro Haz-Mat"],["2-6","Despache al lugar un Carro... (específico)"],["2-7","Despache al lugar una Mecánica Telescópica"],["2-8","Despache al lugar un Carro de Transporte"],["2-9","Despache al lugar un Brazo Articulado / Snorkel"],["2-10","Despache Material Mayor con Motobomba"],["2-11","Despache Material Mayor con Grupo Electrógeno"],["2-12","Despache Material Mayor con Cascada de Aire Comprimido"],["2-13","Despache al lugar un Carro de Rescate Pesado"],["2-14","Despache al lugar un Carro Bomba Forestal"]]},
    {id:"comunicacion",lb:"Comunicación",ic:"📞",cl:"#E9C46A",ds:[
      ["3-0","Comunicarse con la Central de Alarmas"],["3-1","Comunicarse al Cuartel General"],["3-2","Comunicarse con su Compañía"],["3-3","Comunicarse con su domicilio"],["3-4","Comunicarse con su trabajo"],["3-5","Comunicarse con el número..."],["3-6","Desocupe el teléfono del Cuartel"],["3-7","Se solicita comunicación telefónica al celular"],["33","Se solicita comunicación Urgente"]]},
    {id:"frecuencias",lb:"Frecuencias",ic:"📡",cl:"#8338EC",ds:[
      ["5-0","Frecuencia Nacional de Bomberos"],["5-1","Frec. 1 con repetidor (Despacho)"],["5-2","Frec. 2 con repetidor (Tráfico Normal)"],["5-3","Frec. 3 con repetidor (Oficiales Generales)"],["5-4","Frec. 4 con repetidor (Alerce)"],["5-5","Frecuencia 1 sin repetidor"],["5-6","Frecuencia 2 sin repetidor"],["5-7","Frecuencia 3 sin repetidor"],["5-8","Frecuencia 4 sin repetidor"],["5-9","Frecuencia Interna de Compañía"]]},
    {id:"operacion",lb:"Operación",ic:"⚙️",cl:"#F77F00",ds:[
      ["6-0","Dar Conforme: quién va a cargo, n° bomberos, personal especializado"],["6-1","Material Mayor se dirige sin personal (solo conductor)"],["6-2","Indique la dirección exacta"],["6-3","Material Mayor en el lugar"],["6-4","Se solicita instrucciones"],["6-5","Indique ubicación de grifos próximos"],["6-6","Se solicita más personal al lugar"],["6-7","Situación controlada"],["6-8","Material Mayor se encuentra disponible"],["6-9","Material Mayor se retira"],["6-10","Material Mayor en su Cuartel"],["6-11","Material Mayor en panne"],["6-12","Material Mayor sufrió colisión"],["6-13","Material Mayor se dirige a..."],["6-14","Material Mayor a cargar combustible"],["6-15","Material Mayor a recuperar material en Centro Asistencial"],["6-16","Falsa Alarma"],["6-17","Mantención en Cuartel"]]},
    {id:"mando",lb:"Mando",ic:"🎖️",cl:"#D62828",ds:[
      ["7-0","Establece puesto de mando, ubicación, indica OBAC"],["7-1","Indique horas de llamado, alarma y material concurrente"],["7-2","Indique bombero a cargo, ubicación, labor, armado a grifo"],["7-3","Cadáver en el lugar"],["7-4","Artefacto explosivo o incendiario"],["7-5","Se sufre agresión"],["7-6","Solicite apoyo logístico"],["7-7","Autorización para informar a la prensa"],["7-8","Detenga trabajo y evacúe estructura siniestrada de inmediato"],["7-9","Proceda a evacuar a los moradores del inmueble"]]},
    {id:"comandancia",lb:"Comandancia",ic:"🏛️",cl:"#264653",ds:[
      ["8-0","Comandante o Capitán se encuentra disponible"],["8-1","Comandante o Capitán no se encuentra disponible"],["8-2","Envíe K a Cuartel de... Compañía"],["8-3","Envíe K a mi domicilio"],["8-4","Envíe K a mi oficina"],["8-5","Envíe K a la dirección que se indica..."],["8-6","Me dirijo al lugar por mis propios medios"],["8-7","Concurrir todos los Comandantes"]]},
    {id:"guardia",lb:"Guardia",ic:"🛡️",cl:"#606C38",ds:[
      ["9-0","Guardia preventiva grado..."],["9-0 G1","Guardia de X bomberos por Compañías"],["9-0 G2","Guardia Nocturna desde las... Hrs"],["9-0 G3","Acuartelamiento General Inmediato"]]},
    {id:"servicios",lb:"Tipo Servicio",ic:"🔥",cl:"#BC4749",ds:[
      ["10-0","Llamado Estructural"],["10-0-1","Inflamación Ducto Evacuación de Gases"],["10-0-2","Llamado Estructural (casa, local comercial)"],["10-0-3","Estructural en Altura (sobre 3 pisos)"],["10-0-4","Estructural Industrial"],["10-0-5","Estructura Menor"],["10-0-6","Embarcación"],["10-1","Llamado de Vehículos"],["10-1-1","Incendio Vehículo Menor"],["10-1-2","Incendio Vehículo con Pasajeros"],["10-1-3","Incendio Vehículo Transporte de Carga"],["10-2","Llamado Pastizales y/o Basurero"],["10-2-1","Fuego en basurero"],["10-2-2","Fuego en vegetación"],["10-3","Rescate de Emergencia"],["10-3-1","Rescate Persona Encerrada"],["10-3-2","Rescate de Persona"],["10-3-3","Rescate Persona en Alturas o Desnivel"],["10-3-4","Rescate Persona en Aguas"],["10-3-5","Rescate Persona Estructura Colapsada"],["10-3-6","Rescate Persona Espacios Confinados"],["10-4","Rescate Vehicular"],["10-4-1","Rescate Vehicular Liviano"],["10-4-2","Rescate Vehicular Pesado / muchas víctimas"],["10-4-3","Rescate Vehicular Camión Mat. Peligrosos"],["10-4-4","Rescate Vehicular Desnivel / Agua / Quebrada"],["10-5","Llamado Haz-Mat"],["10-5-1","Derrame de Hidrocarburo"],["10-5-2","Incidente con Materiales Peligrosos"],["10-6","Emanación de Gases"],["10-6-1","Verificar Olor a Combustible"],["10-6-2","Verificar Fuga/Olor Gas Licuado o Natural"],["10-6-3","Explosión de Gas"],["10-6-4","Explosión de Gas con fuego"],["10-7","Llamado Eléctrico"],["10-8","Llamado No Clasificado"],["10-9","Llamado a Otros Servicios"],["10-10","Incendio declarado (1ª Alarma)"],["10-11","Accidente Aéreo"],["10-12","Apoyo a otros Cuerpos de Bomberos"],["10-13","Bomba, Atentados Terroristas, etc."],["10-14","Simulacro"],["10-61","Anular clave anterior"]]},
    {id:"radio",lb:"Radio / Varios",ic:"🔧",cl:"#6D6875",ds:[
      ["11-0","Indique cómo recibe"],["11-1","Fuerte y claro"],["11-2","Se recibe con interferencias"],["11-3","Central solo por frecuencia principal"],["11-4","Indique operador en servicio"],["11-5","Central en transmisión de pruebas"],["11-6","Central transmisión abierta accidentalmente"],["12-1","Asigna cuartel de reemplazo"],["12-2","Retira cuartel de reemplazo"],["12-3","Diríjase al lugar con máxima precaución"],["12-4","Toque sirena del Cuartel"],["12-5","Active inversor de voz"],["12-6","Material Mayor suficiente en el lugar"],["12-7","No armar"],["12-8","Capitán... asume el mando del Cuerpo"],["12-9","Citación a... Compañía"],["12-10","Solicita conductor para..."]]}
  ];
  var cuart = [["R-10","1ª Compañía"],["R-20","2ª Compañía"],["R-30","3ª Compañía"],["R-40","4ª Compañía"],["R-50","5ª Compañía"],["R-60","6ª Compañía"],["R-70","7ª Compañía"],["R-80","8ª Compañía"],["R-90","9ª Compañía"]];

  var activeCat = null;
  var showQ = false;
  var QCOLOR = "#94A3B8";

  // DOM refs
  var root = document.documentElement;
  var hero = document.getElementById("hero");
  var readout = document.getElementById("ro");
  var searchWrap = document.getElementById("sw");
  var searchInput = document.getElementById("si");
  var searchClear = document.getElementById("sx");
  var chipsRow = document.getElementById("cr");
  var content = document.getElementById("ct");
  var footer = document.getElementById("ft");
  var backBar = document.getElementById("bb");
  var backBtn = document.getElementById("bk");
  var installBanner = document.getElementById("ib");
  var installText = document.getElementById("it");
  var installClose = document.getElementById("ic");
  var themeBtn = document.getElementById("th");
  var toast = document.getElementById("ts");
  var themeMeta = document.querySelector('meta[name="theme-color"]');

  // ===== UTILIDADES =====
  function norm(str) {
    return str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function esc(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Resalta las coincidencias ignorando tildes y mayúsculas, sin alterar el texto original
  function mark(text, q) {
    var buf = "", map = [], i, j, n;
    for (i = 0; i < text.length; i++) {
      n = norm(text.charAt(i));
      for (j = 0; j < n.length; j++) { buf += n.charAt(j); map.push(i); }
    }
    var out = "", last = 0, pos = 0, idx, s, e;
    while ((idx = buf.indexOf(q, pos)) !== -1) {
      s = map[idx]; e = map[idx + q.length - 1] + 1;
      if (s < last) { pos = idx + 1; continue; }
      out += esc(text.slice(last, s)) + "<mark>" + esc(text.slice(s, e)) + "</mark>";
      last = e; pos = idx + q.length;
    }
    return out + esc(text.slice(last));
  }

  function isSub(code) {
    return code.split("-").length > 2 || code.indexOf("G") !== -1;
  }

  function makeCard(code, desc, color, query) {
    var sub = isSub(code) ? " s" : "";
    return '<button type="button" class="crd k' + sub + '" style="--c:' + color + '" data-code="' + esc(code) + '" title="Tocar para copiar la clave">' +
      '<span class="bdg">' + (query ? mark(code, query) : esc(code)) + '</span>' +
      '<span class="dsc">' + (query ? mark(desc, query) : esc(desc)) + '</span></button>';
  }

  function toastMsg(html) {
    toast.innerHTML = html;
    toast.className = "toast on";
    clearTimeout(toastMsg.t);
    toastMsg.t = setTimeout(function() { toast.className = "toast"; }, 1600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      } catch (err) { reject(err); }
    });
  }

  // ===== CABECERA: RESUMEN =====
  (function buildReadout() {
    var total = 0;
    for (var i = 0; i < cats.length; i++) total += cats[i].ds.length;
    readout.innerHTML =
      '<div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>' +
      '<div class="stat"><b>' + total + '</b><span>claves</span></div>' +
      '<div class="stat"><b>' + cats.length + '</b><span>categorías</span></div>' +
      '<div class="stat"><b>' + cuart.length + '</b><span>cuarteles</span></div>';
  })();

  // ===== CHIPS (se construyen una vez para conservar el desplazamiento) =====
  (function buildChips() {
    var h = "";
    for (var i = 0; i < cats.length; i++) {
      h += '<button type="button" class="chp k" role="tab" aria-selected="false" style="--c:' + cats[i].cl + '" data-id="' + cats[i].id + '">' +
        '<span aria-hidden="true">' + cats[i].ic + '</span>' + esc(cats[i].lb) + '</button>';
    }
    chipsRow.innerHTML = h;
  })();

  function syncChips() {
    var chips = chipsRow.children, on = null;
    for (var i = 0; i < chips.length; i++) {
      var active = chips[i].getAttribute("data-id") === activeCat;
      chips[i].className = "chp k" + (active ? " on" : "");
      chips[i].setAttribute("aria-selected", active ? "true" : "false");
      if (active) on = chips[i];
    }
    if (on && on.scrollIntoView) {
      try { on.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); } catch (e) { on.scrollIntoView(); }
    }
  }

  // ===== RENDER =====
  function render() {
    var query = norm(searchInput.value.trim());
    var isSearching = query.length > 0;
    var html = "";

    searchClear.className = isSearching ? "srch-x vis" : "srch-x";
    searchWrap.className = isSearching ? "srch has" : "srch";
    backBar.hidden = !(!isSearching && activeCat);
    chipsRow.hidden = isSearching;
    hero.className = (isSearching || activeCat) ? "hero compact" : "hero";
    footer.style.display = isSearching ? "none" : "";
    syncChips();

    // ===== BÚSQUEDA =====
    if (isSearching) {
      var results = [], si, sj, sk, sItem, qItem;
      for (si = 0; si < cats.length; si++) {
        for (sj = 0; sj < cats[si].ds.length; sj++) {
          sItem = cats[si].ds[sj];
          if (norm(sItem[0]).indexOf(query) !== -1 || norm(sItem[1]).indexOf(query) !== -1) {
            results.push({ code: sItem[0], desc: sItem[1], color: cats[si].cl, label: cats[si].lb, icon: cats[si].ic });
          }
        }
      }
      for (sk = 0; sk < cuart.length; sk++) {
        qItem = cuart[sk];
        if (norm(qItem[0]).indexOf(query) !== -1 || norm(qItem[1]).indexOf(query) !== -1) {
          results.push({ code: qItem[0], desc: qItem[1], color: QCOLOR, label: "Cuarteles", icon: "🏠" });
        }
      }

      html += '<div class="rl">' + results.length + " resultado" + (results.length !== 1 ? "s" : "") + "</div>";
      if (results.length === 0) {
        html += '<div class="emp"><div class="big" aria-hidden="true">📻</div><p>No se encontraron claves</p><p>Prueba con otro término</p></div>';
      } else {
        var lastLabel = null, ri, rItem;
        for (ri = 0; ri < results.length; ri++) {
          rItem = results[ri];
          if (rItem.label !== lastLabel) {
            if (lastLabel !== null) html += '</div>';
            html += '<div class="rg k" style="--c:' + rItem.color + (lastLabel === null ? ";margin-top:0" : "") + '"><span aria-hidden="true">' + rItem.icon + '</span> ' + esc(rItem.label) + '</div><div class="panel list">';
            lastLabel = rItem.label;
          }
          html += makeCard(rItem.code, rItem.desc, rItem.color, query);
        }
        html += '</div>';
      }
      content.innerHTML = html;
      return;
    }

    // ===== CATEGORÍA ACTIVA =====
    if (activeCat) {
      var aCat = null, ai, aj;
      for (ai = 0; ai < cats.length; ai++) {
        if (cats[ai].id === activeCat) { aCat = cats[ai]; break; }
      }
      if (!aCat) return;
      html += '<div class="ach k" style="--c:' + aCat.cl + '"><span class="si" aria-hidden="true">' + aCat.ic + '</span><h2>' + esc(aCat.lb) + '</h2>';
      html += '<span class="ab">' + aCat.ds.length + '</span></div><div class="panel list">';
      for (aj = 0; aj < aCat.ds.length; aj++) {
        html += makeCard(aCat.ds[aj][0], aCat.ds[aj][1], aCat.cl, "");
      }
      html += '</div>';
      content.innerHTML = html;
      return;
    }

    // ===== INICIO =====
    html += '<button type="button" class="qbtn' + (showQ ? " op" : "") + '" id="qb" aria-expanded="' + (showQ ? "true" : "false") + '"><span>🏠 Cuarteles de Compañías<small>' + cuart.length + ' cuarteles</small></span><span class="qa" aria-hidden="true">▼</span></button>';
    if (showQ) {
      html += '<div class="panel cols">';
      for (var qi = 0; qi < cuart.length; qi++) {
        html += makeCard(cuart[qi][0], "Cuartel " + cuart[qi][1], QCOLOR, "");
      }
      html += '</div>';
    }

    html += '<div class="secs">';
    for (var hi = 0; hi < cats.length; hi++) {
      var hCat = cats[hi];
      html += '<section class="sec k" style="--c:' + hCat.cl + '"><button type="button" class="sec-h" data-id="' + hCat.id + '">';
      html += '<span class="si" aria-hidden="true">' + hCat.ic + '</span><h2>' + esc(hCat.lb) + '</h2>';
      html += '<span class="ct">' + hCat.ds.length + '</span>';
      html += '<span class="ar">Ver todo →</span></button>';
      var limit = Math.min(3, hCat.ds.length);
      for (var hj = 0; hj < limit; hj++) {
        html += makeCard(hCat.ds[hj][0], hCat.ds[hj][1], hCat.cl, "");
      }
      if (hCat.ds.length > 3) {
        html += '<button type="button" class="more" data-id="' + hCat.id + '">+ ' + (hCat.ds.length - 3) + ' claves más</button>';
      }
      html += '</section>';
    }
    html += '</div>';

    content.innerHTML = html;
  }

  function goTop() {
    window.scrollTo(0, 0);
  }

  // ===== EVENTOS =====
  chipsRow.addEventListener("click", function(e) {
    var btn = e.target.closest(".chp");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    activeCat = (activeCat === id) ? null : id;
    render();
    goTop();
  });

  content.addEventListener("click", function(e) {
    var card = e.target.closest(".crd");
    var secBtn = e.target.closest(".sec-h");
    var moreBtn = e.target.closest(".more");
    var qBtn = e.target.closest("#qb");

    if (card) {
      var code = card.getAttribute("data-code");
      copyText(code).then(function() {
        toastMsg("Clave <b>" + esc(code) + "</b> copiada");
      }, function() {
        toastMsg("No se pudo copiar la clave");
      });
    } else if (secBtn) {
      activeCat = secBtn.getAttribute("data-id");
      render();
      goTop();
    } else if (moreBtn) {
      activeCat = moreBtn.getAttribute("data-id");
      render();
      goTop();
    } else if (qBtn) {
      showQ = !showQ;
      render();
    }
  });

  backBtn.addEventListener("click", function() {
    activeCat = null;
    render();
    goTop();
  });

  searchInput.addEventListener("input", function() {
    activeCat = null;
    render();
  });

  searchClear.addEventListener("click", function() {
    searchInput.value = "";
    searchInput.focus();
    render();
  });

  document.addEventListener("keydown", function(e) {
    var tag = (e.target && e.target.tagName) || "";
    if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === "Escape" && document.activeElement === searchInput) {
      searchInput.value = "";
      render();
    }
  });

  // ===== TEMA =====
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function syncThemeColor() {
    if (themeMeta) themeMeta.setAttribute("content", isDark() ? "#0B0E15" : "#EDF0F5");
  }
  themeBtn.addEventListener("click", function() {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("cbpm-theme", next); } catch (e) {}
    syncThemeColor();
  });
  syncThemeColor();

  // ===== AVISO DE INSTALACIÓN (iOS) =====
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var isStandalone = (window.navigator.standalone === true);
  var bannerClosed = false;
  try { bannerClosed = localStorage.getItem("cbpm-ios-banner") === "1"; } catch (e) {}
  if (isIOS && !isStandalone && !bannerClosed) {
    installText.innerHTML = '<strong>Instalar como App:</strong> toca <strong>Compartir</strong> (↑) y luego <strong>"Agregar a Inicio"</strong>';
    installBanner.className = "ibanner vis";
  }
  installClose.addEventListener("click", function() {
    installBanner.className = "ibanner";
    try { localStorage.setItem("cbpm-ios-banner", "1"); } catch (e) {}
  });

  // ===== INICIO =====
  render();

})();
</script>
</body>
</html>
