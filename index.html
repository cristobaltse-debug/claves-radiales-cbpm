<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="color-scheme" content="light dark">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<script>
  // Aplica el tema guardado antes de pintar, para evitar parpadeo
  (function(){
    try {
      var t = localStorage.getItem("cbpm-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  /* Cartilla institucional: banda azul del escudo con franja roja, hoja blanca,
     claves en letra condensada como la rotulación de los carros. En pantallas
     anchas, índice de series a la izquierda y cartilla a la derecha. */
  :root {
    --bg: #ECEEF4;
    --sheet: #FFFFFF;
    --ink: #0B1238;
    --ink-2: #394066;
    --ink-3: #5C6286;
    --rule: #DCDFE8;
    --rule-2: #B9BED0;
    --hover: #F3F5FA;
    --code: #0A1472;
    --head: #0A1472;
    --head-2: #071054;
    --red: #D3141C;
    --gold: #E8B20C;
    --mark: #FFE27A;
    --toast-bg: #0B1238;
    --toast-fg: #FFFFFF;
    --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --text: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --ico-sun: none;
    --ico-moon: block;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #060A22;
      --sheet: #0C1333;
      --ink: #EEF0F8;
      --ink-2: #C4C8DE;
      --ink-3: #959CBD;
      --rule: #1E2753;
      --rule-2: #36407A;
      --hover: #111A42;
      --code: #B7C4FF;
      --head: #0A1160;
      --head-2: #070C44;
      --red: #FF4B50;
      --gold: #F2C230;
      --mark: rgba(242,194,48,0.40);
      --toast-bg: #EEF0F8;
      --toast-fg: #0B1238;
      --ico-sun: block;
      --ico-moon: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #060A22;
    --sheet: #0C1333;
    --ink: #EEF0F8;
    --ink-2: #C4C8DE;
    --ink-3: #959CBD;
    --rule: #1E2753;
    --rule-2: #36407A;
    --hover: #111A42;
    --code: #B7C4FF;
    --head: #0A1160;
    --head-2: #070C44;
    --red: #FF4B50;
    --gold: #F2C230;
    --mark: rgba(242,194,48,0.40);
    --toast-bg: #EEF0F8;
    --toast-fg: #0B1238;
    --ico-sun: block;
    --ico-moon: none;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: var(--text); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap {
    width: 100%; max-width: 1120px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ===== CABECERA INSTITUCIONAL ===== */
  .top {
    background: var(--head); color: #fff;
    padding-top: env(safe-area-inset-top, 0px);
    border-bottom: 6px solid var(--red);
  }
  .top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
  .logo { width: 68px; height: 68px; flex-shrink: 0; display: block; }
  .ttl { flex: 1; min-width: 0; }
  .ttl .org {
    font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold); line-height: 1.2;
  }
  .ttl h1 {
    font-family: var(--display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(32px, 8.4vw, 54px); line-height: 0.95; letter-spacing: 0.01em; margin-top: 4px;
  }
  .ttl .ref { font-size: 13px; color: rgba(255,255,255,0.72); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tbtn {
    width: 40px; height: 40px; flex-shrink: 0; align-self: flex-start; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.35); border-radius: 6px; background: transparent; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn:hover { background: rgba(255,255,255,0.10); }
  .tbtn .sun { display: var(--ico-sun); }
  .tbtn .moon { display: var(--ico-moon); }

  /* ===== BARRA FIJA ===== */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: var(--sheet); border-bottom: 1px solid var(--rule-2);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .bar .wrap { padding-top: 10px; }
  .srch { position: relative; }
  .srch svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .srch input {
    width: 100%; height: 48px; padding: 0 86px 0 42px;
    border: 2px solid var(--rule-2); border-radius: 6px; background: var(--sheet); color: var(--ink);
    font-family: var(--text); font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .srch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .srch input::placeholder { color: var(--ink-3); }
  .srch input:focus { border-color: var(--code); }
  .clr {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    height: 36px; padding: 0 12px; border: none; border-radius: 4px; cursor: pointer;
    background: var(--hover); color: var(--ink-2); font-size: 14px; font-weight: 600;
  }
  .tabs {
    display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    margin: 6px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; display: flex; align-items: baseline; gap: 6px; cursor: pointer; white-space: nowrap;
    padding: 10px 12px 9px; background: none; border: none; border-bottom: 3px solid transparent;
    font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .tab b { font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--red); }
  .bar .pad { height: 10px; }

  /* ===== DISPOSICIÓN ===== */
  .layout { padding-top: 20px; padding-bottom: 48px; }
  .side { display: none; }
  .main { min-width: 0; }

  .note {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 12px 14px;
    background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 6px;
    font-size: 14px; line-height: 1.45; color: var(--ink-2);
  }
  .note b { color: var(--ink); }
  .note button { margin-left: auto; flex-shrink: 0; width: 32px; height: 32px; border: none; border-radius: 4px; background: var(--hover); color: var(--ink-2); cursor: pointer; font-size: 15px; }

  .count { font-size: 14px; color: var(--ink-3); margin-bottom: 14px; }
  .count b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; }
  .sec { padding: 22px 18px 10px; border-top: 1px solid var(--rule); }
  .sec:first-child { border-top: none; }
  .sec-h { display: flex; align-items: flex-end; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
  .sn {
    font-family: var(--display); font-weight: 800; font-size: 42px; line-height: 0.82; color: var(--red);
    font-variant-numeric: tabular-nums; min-width: 44px;
  }
  .sec-h h2 {
    font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; text-transform: uppercase;
    letter-spacing: 0.02em; flex: 1; min-width: 0; text-wrap: balance;
  }
  .sc { font-size: 13px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .row {
    display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: baseline; width: 100%;
    padding: 11px 6px; border: none; border-bottom: 1px solid var(--rule); background: none;
    text-align: left; cursor: pointer;
  }
  .rows .row:last-child { border-bottom: none; }
  .row:hover { background: var(--hover); }
  .row:active { background: var(--rule); }
  .cd {
    font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--code);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ds { font-size: 16px; line-height: 1.4; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .row.par .ds { font-weight: 600; }
  .row.sub { grid-template-columns: 84px 1fr; padding-left: 22px; }
  .row.sub .cd { font-size: 18px; font-weight: 600; color: var(--ink-2); }
  .row.sub .ds { font-size: 15px; color: var(--ink-2); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  .rows.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); column-gap: 18px; }
  .rows.grid3 .row { border-bottom: 1px solid var(--rule); grid-template-columns: 64px 1fr; }

  .empty { padding: 48px 18px; text-align: center; }
  .empty p { font-size: 17px; font-weight: 600; }
  .empty p + p { font-size: 14px; font-weight: 400; color: var(--ink-3); margin-top: 4px; }

  .foot { display: flex; align-items: center; gap: 12px; margin-top: 26px; color: var(--ink-3); font-size: 13px; line-height: 1.45; }
  .foot img { width: 40px; height: 40px; flex-shrink: 0; }
  .foot b { color: var(--ink-2); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px);
    background: var(--toast-bg); color: var(--toast-fg); padding: 11px 16px; border-radius: 6px;
    font-size: 15px; font-weight: 500; transition: opacity 0.18s, transform 0.18s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast b { font-family: var(--display); font-weight: 700; font-size: 17px; }

  /* ===== PANTALLAS ANCHAS: índice lateral ===== */
  @media (min-width: 980px) {
    .top .wrap { padding-top: 26px; padding-bottom: 26px; gap: 20px; }
    .logo { width: 88px; height: 88px; }
    .tabs { display: none; }
    .layout { display: grid; grid-template-columns: 236px 1fr; gap: 28px; align-items: start; padding-top: 28px; }
    .side { display: block; position: sticky; top: calc(var(--bar-h, 70px) + 20px); }
    .side h3 { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; padding-left: 12px; }
    .side a {
      display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; text-decoration: none; color: var(--ink-2);
      border-left: 3px solid transparent; font-size: 15px;
    }
    .side a b { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--red); min-width: 44px; font-variant-numeric: tabular-nums; }
    .side a span { flex: 1; }
    .side a small { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
    .side a:hover { color: var(--ink); background: var(--sheet); }
    .side a.on { color: var(--ink); border-left-color: var(--red); background: var(--sheet); font-weight: 600; }
    .side a.dim { opacity: 0.4; }
    .sec { padding: 26px 26px 12px; }
    .row { grid-template-columns: 96px 1fr; }
    .row.sub { grid-template-columns: 96px 1fr; }
  }
  @media (max-width: 420px) {
    .logo { width: 58px; height: 58px; }
    .top .wrap { gap: 12px; }
    .ttl .org { font-size: 11.5px; }
    .row, .row.sub { grid-template-columns: 70px 1fr; gap: 10px; }
    .row.sub { padding-left: 14px; }
    .sec { padding-left: 12px; padding-right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  @media print {
    :root { --bg: #fff; --sheet: #fff; --ink: #000; --ink-2: #222; --ink-3: #444; --rule: #ccc; --code: #0A1472; }
    .bar, .side, .toast, .note, .tbtn, .count { display: none !important; }
    .layout { display: block; }
    .sheet { border: none; }
    .sec { break-inside: auto; }
    .row { break-inside: avoid; }
  }
</style>
</head>

<header class="top">

<div class="bar" id="bar">

      <input id="si" type="search" placeholder="Buscar clave o descripción" aria-label="Buscar clave o descripción" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">

</div>

<div class="wrap layout">

    <footer class="foot">
      <img src="img/logo.png" alt="" width="40" height="40">
      <div><b>Cuerpo de Bomberos de Puerto Montt</b><br>Cartilla de claves radiales POE-C01. Toca una clave para copiarla.</div>
    </footer>
  </main>
</div>

    {id:"guardia",lb:"Guardia",ic:"🛡️",cl:"#606C38",ds:[
      ["9-0","Guardia preventiva grado..."],["9-0 G1","Guardia de X bomberos por Compañías"],["9-0 G2","Guardia Nocturna desde las... Hrs"],["9-0 G3","Acuartelamiento General Inmediato"]]},
    {id:"servicios",lb:"Tipo Servicio",ic:"🔥",cl:"#BC4749",ds:[
      ["10-0","Llamado Estructural"],["10-0-1","Inflamación Ducto Evacuación de Gases"],["10-0-2","Llamado Estructural (casa, local comercial)"],["10-0-3","Estructural en Altura (sobre 3 pisos)"],["10-0-4","Estructural Industrial"],["10-0-5","Estructura Menor"],["10-0-6","Embarcación"],["10-1","Llamado de Vehículos"],["10-1-1","Incendio Vehículo Menor"],["10-1-2","Incendio Vehículo con Pasajeros"],["10-1-3","Incendio Vehículo Transporte de Carga"],["10-2","Llamado Pastizales y/o Basurero"],["10-2-1","Fuego en basurero"],["10-2-2","Fuego en vegetación"],["10-3","Rescate de Emergencia"],["10-3-1","Rescate Persona Encerrada"],["10-3-2","Rescate de Persona"],["10-3-3","Rescate Persona en Alturas o Desnivel"],["10-3-4","Rescate Persona en Aguas"],["10-3-5","Rescate Persona Estructura Colapsada"],["10-3-6","Rescate Persona Espacios Confinados"],["10-4","Rescate Vehicular"],["10-4-1","Rescate Vehicular Liviano"],["10-4-2","Rescate Vehicular Pesado / muchas víctimas"],["10-4-3","Rescate Vehicular Camión Mat. Peligrosos"],["10-4-4","Rescate Vehicular Desnivel / Agua / Quebrada"],["10-5","Llamado Haz-Mat"],["10-5-1","Derrame de Hidrocarburo"],["10-5-2","Incidente con Materiales Peligrosos"],["10-6","Emanación de Gases"],["10-6-1","Verificar Olor a Combustible"],["10-6-2","Verificar Fuga/Olor Gas Licuado o Natural"],["10-6-3","Explosión de Gas"],["10-6-4","Explosión de Gas con fuego"],["10-7","Llamado Eléctrico"],["10-8","Llamado No Clasificado"],["10-9","Llamado a Otros Servicios"],["10-10","Incendio declarado (1ª Alarma)"],["10-11","Accidente Aéreo"],["10-12","Apoyo a otros Cuerpos de Bomberos"],["10-13","Bomba, Atentados Terroristas, etc."],["10-14","Simulacro"],["10-61","Anular clave anterior"]]},
    {id:"radio",lb:"Radio / Varios",ic:"🔧",cl:"#6D6875",ds:[
      ["11-0","Indique cómo recibe"],["11-1","Fuerte y claro"],["11-2","Se recibe con interferencias"],["11-3","Central solo por frecuencia principal"],["11-4","Indique operador en servicio"],["11-5","Central en transmisión de pruebas"],["11-6","Central transmisión abierta accidentalmente"],["12-1","Asigna cuartel de reemplazo"],["12-2","Retira cuartel de reemplazo"],["12-3","Diríjase al lugar con máxima precaución"],["12-4","Toque sirena del Cuartel"],["12-5","Active inversor de voz"],["12-6","Material Mayor suficiente en el lugar"],["12-7","No armar"],["12-8","Capitán... asume el mando del Cuerpo"],["12-9","Citación a... Compañía"],["12-10","Solicita conductor para..."]]}
  ];
  var cuart = [["R-10","1ª Compañía"],["R-20","2ª Compañía"],["R-30","3ª Compañía"],["R-40","4ª Compañía"],["R-50","5ª Compañía"],["R-60","6ª Compañía"],["R-70","7ª Compañía"],["R-80","8ª Compañía"],["R-90","9ª Compañía"]];

  // ===== REFERENCIAS =====
  var root = document.documentElement;
  var bar = document.getElementById("bar");
  var searchInput = document.getElementById("si");
  var searchClear = document.getElementById("sx");
  var tabsEl = document.getElementById("tb");
  var sideEl = document.getElementById("sd");
  var content = document.getElementById("ct");
  var countEl = document.getElementById("cn");
  var refEl = document.getElementById("ref");
  var toast = document.getElementById("ts");
  var themeBtn = document.getElementById("th");
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ===== UTILIDADES =====
  function norm(str) {
    return str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function esc(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // Resalta coincidencias ignorando tildes y mayúsculas, sin alterar el texto original
  function mark(text, q) {
    if (!q) return esc(text);
    var buf = "", map = [], i, j, n;
    for (i = 0; i < text.length; i++) {
      n = norm(text.charAt(i));
      for (j = 0; j < n.length; j++) { buf += n.charAt(j); map.push(i); }
    }
    var out = "", last = 0, pos = 0, idx, s, e;
    while ((idx = buf.indexOf(q, pos)) !== -1) {
      s = map[idx]; e = map[idx + q.length - 1] + 1;
      if (s < last) { pos = idx + 1; continue; }
      out += esc(text.slice(last, s)) + "<mark>" + esc(text.slice(s, e)) + "</mark>";
      last = e; pos = idx + q.length;
    }
    return out + esc(text.slice(last));
  }
  function isSub(code) {
    return code.split("-").length > 2 || code.indexOf("G") !== -1;
  }
  function matches(item, q) {
    return norm(item[0]).indexOf(q) !== -1 || norm(item[1]).indexOf(q) !== -1;
  }

  // Serie de cada categoría, tomada de sus propias claves (prefijos con dos o más claves)
  function seriesOf(cat) {
    var counts = {}, order = [], i, p;
    for (i = 0; i < cat.ds.length; i++) {
      p = cat.ds[i][0].split(/[- ]/)[0];
      if (!counts[p]) { counts[p] = 0; order.push(p); }
      counts[p]++;
    }
    var out = [];
    for (i = 0; i < order.length; i++) if (counts[order[i]] > 1) out.push(order[i]);
    return (out.length ? out : [order[0]]).join("·");
  }

  // Lista de secciones: las categorías y, al final, los cuarteles
  var sections = [];
  (function buildSections() {
    for (var i = 0; i < cats.length; i++) {
      sections.push({ id: cats[i].id, sn: seriesOf(cats[i]), lb: cats[i].lb, items: cats[i].ds, quarters: false });
    }
    var q = [];
    for (var k = 0; k < cuart.length; k++) q.push([cuart[k][0], cuart[k][1]]);
    sections.push({ id: "cuarteles", sn: "R", lb: "Cuarteles", items: q, quarters: true });
  })();

  var totalCodes = 0;
  for (var tc = 0; tc < cats.length; tc++) totalCodes += cats[tc].ds.length;
  refEl.textContent = "Cartilla POE-C01 · " + totalCodes + " claves · " + cuart.length + " cuarteles";

  // ===== ÍNDICES (pestañas en móvil, índice lateral en pantallas anchas) =====
  (function buildNav() {
    var t = "", s = '<h3>Series</h3>';
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      t += '<button type="button" class="tab" data-id="' + sec.id + '"><b>' + esc(sec.sn) + '</b>' + esc(sec.lb) + '</button>';
      s += '<a href="#s-' + sec.id + '" data-id="' + sec.id + '"><b>' + esc(sec.sn) + '</b><span>' + esc(sec.lb) + '</span><small>' + sec.items.length + '</small></a>';
    }
    tabsEl.innerHTML = t;
    sideEl.innerHTML = s;
  })();

  // ===== CARTILLA =====
  function rowHTML(item, next, q, quarters) {
    var code = item[0], desc = item[1];
    var cls = "row";
    if (!quarters) {
      if (isSub(code)) cls += " sub";
      else if (next && isSub(next[0])) cls += " par";
    }
    return '<button type="button" class="' + cls + '" data-code="' + esc(code) + '">' +
      '<span class="cd">' + mark(code, q) + '</span><span class="ds">' + mark(desc, q) + '</span></button>';
  }

  var visibleIds = [];

  function render() {
    var q = norm(searchInput.value.trim());
    var searching = q.length > 0;
    var html = "", found = 0, i, j;
    visibleIds = [];

    for (i = 0; i < sections.length; i++) {
      var sec = sections[i], rows = "", n = 0;
      for (j = 0; j < sec.items.length; j++) {
        if (searching && !matches(sec.items[j], q)) continue;
        rows += rowHTML(sec.items[j], sec.items[j + 1], q, sec.quarters);
        n++;
      }
      if (!n) continue;
      found += n;
      visibleIds.push(sec.id);
      html += '<section class="sec" id="s-' + sec.id + '" data-id="' + sec.id + '">' +
        '<div class="sec-h"><span class="sn">' + esc(sec.sn) + '</span><h2>' + esc(sec.lb) + '</h2>' +
        '<span class="sc">' + (searching ? n + " de " + sec.items.length : sec.items.length + (sec.quarters ? " cuarteles" : " claves")) + '</span></div>' +
        '<div class="rows' + (sec.quarters ? " grid3" : "") + '">' + rows + '</div></section>';
    }

    if (searching && !found) {
      html = '<div class="empty"><p>No hay claves que coincidan</p><p>Prueba con el número de la clave o con otra palabra</p></div>';
    }
    content.innerHTML = html;

    searchClear.hidden = !searching;
    tabsEl.hidden = searching;
    countEl.hidden = !searching;
    if (searching) {
      countEl.innerHTML = "<b>" + found + "</b> " + (found === 1 ? "resultado" : "resultados") + " para «" + esc(searchInput.value.trim()) + "»";
    }
    var links = sideEl.querySelectorAll("a");
    for (i = 0; i < links.length; i++) {
      links[i].className = (searching && visibleIds.indexOf(links[i].getAttribute("data-id")) === -1) ? "dim" : "";
    }
    measureBar();
    spy();
  }

  // ===== NAVEGACIÓN Y SECCIÓN ACTIVA =====
  var barH = 0;
  function measureBar() {
    barH = bar.offsetHeight;
    root.style.setProperty("--bar-h", barH + "px");
  }

  function goTo(id) {
    if (searchInput.value) { searchInput.value = ""; render(); }
    var el = document.getElementById("s-" + id);
    if (!el) return;
    var y = el.getBoundingClientRect().top + window.pageYOffset - barH - 6;
    setActive(id);
    navLock = true;
    clearTimeout(unlockTimer);
    unlockTimer = setTimeout(function() { navLock = false; }, 1500);
    window.scrollTo({ top: Math.max(0, y), behavior: reduceMotion ? "auto" : "smooth" });
  }

  var activeId = null;
  var navLock = false, unlockTimer = null;
  function setActive(id) {
    if (id === activeId) return;
    activeId = id;
    var tabs = tabsEl.children, on = null, i;
    for (i = 0; i < tabs.length; i++) {
      var is = tabs[i].getAttribute("data-id") === id;
      tabs[i].className = "tab" + (is ? " on" : "");
      if (is) { tabs[i].setAttribute("aria-current", "true"); on = tabs[i]; } else { tabs[i].removeAttribute("aria-current"); }
    }
    var links = sideEl.querySelectorAll("a");
    for (i = 0; i < links.length; i++) {
      var dim = links[i].className.indexOf("dim") !== -1 ? " dim" : "";
      links[i].className = (links[i].getAttribute("data-id") === id ? "on" : "") + dim;
    }
    if (on && !tabsEl.hidden) {
      var left = on.offsetLeft - (tabsEl.clientWidth - on.offsetWidth) / 2;
      try { tabsEl.scrollTo({ left: left, behavior: reduceMotion ? "auto" : "smooth" }); } catch (e) { tabsEl.scrollLeft = left; }
    }
  }

  function spy() {
    if (navLock) return;
    var secs = content.querySelectorAll(".sec"), cur = null;
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].getBoundingClientRect().top - barH - 40 <= 0) cur = secs[i].getAttribute("data-id");
    }
    if (!cur && secs.length) cur = secs[0].getAttribute("data-id");
    if (cur) setActive(cur);
  }

  var ticking = false;
  window.addEventListener("scroll", function() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() { ticking = false; spy(); });
    if (navLock) {
      clearTimeout(unlockTimer);
      unlockTimer = setTimeout(function() { navLock = false; }, 160);
    }
  }, { passive: true });
  window.addEventListener("resize", function() { measureBar(); spy(); });

  tabsEl.addEventListener("click", function(e) {
    var b = e.target.closest(".tab");
    if (b) goTo(b.getAttribute("data-id"));
  });
  sideEl.addEventListener("click", function(e) {
    var a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    goTo(a.getAttribute("data-id"));
  });

  // ===== BÚSQUEDA =====
  searchInput.addEventListener("input", function() {
    render();
    window.scrollTo(0, Math.min(window.pageYOffset, document.querySelector(".top").offsetHeight));
  });
  searchClear.addEventListener("click", function() {
    searchInput.value = "";
    searchInput.focus();
    render();
  });
  document.addEventListener("keydown", function(e) {
    var tag = (e.target && e.target.tagName) || "";
    if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === "Escape" && document.activeElement === searchInput && searchInput.value) {
      searchInput.value = "";
      render();
    }
  });

  // ===== COPIAR CLAVE =====
  function showToast(html) {
    toast.innerHTML = html;
    toast.className = "toast on";
    clearTimeout(showToast.t);
    showToast.t = setTimeout(function() { toast.className = "toast"; }, 1600);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      } catch (err) { reject(err); }
    });
  }
  content.addEventListener("click", function(e) {
    var row = e.target.closest(".row");
    if (!row) return;
    var code = row.getAttribute("data-code");
    copyText(code).then(function() {
      showToast("Clave <b>" + esc(code) + "</b> copiada");
    }, function() {
      showToast("No se pudo copiar la clave");
    });
  });

  // ===== TEMA =====
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function syncThemeColor() {
    if (themeMeta) themeMeta.setAttribute("content", isDark() ? "#0A1160" : "#0A1472");
  }
  themeBtn.addEventListener("click", function() {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("cbpm-theme", next); } catch (e) {}
    syncThemeColor();
  });
  syncThemeColor();

  // ===== AVISO DE INSTALACIÓN (iOS) =====
  var note = document.getElementById("ib");
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var isStandalone = (window.navigator.standalone === true);
  var closed = false;
  try { closed = localStorage.getItem("cbpm-ios-banner") === "1"; } catch (e) {}
  if (isIOS && !isStandalone && !closed) {
    document.getElementById("it").innerHTML = '<b>Instalar como app:</b> toca Compartir (↑) y luego <b>Agregar a inicio</b>.';
    note.hidden = false;
  }
  document.getElementById("ic").addEventListener("click", function() {
    note.hidden = true;
    try { localStorage.setItem("cbpm-ios-banner", "1"); } catch (e) {}
  });

  // ===== INICIO =====
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() { measureBar(); spy(); });

})();
</script>
